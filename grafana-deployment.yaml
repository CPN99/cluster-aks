apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana  # Chemin où Grafana stock les donnees
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc  # Nom du PVC que vous devez cree
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
