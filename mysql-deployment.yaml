apiVersion: apps/v1  
kind: Deployment  
metadata:
  name: mysql  
spec:
  replicas: 1  
  selector:
    matchLabels:
      app: mysql  
  template:
    metadata:
      labels:
        app: mysql  
    spec:
      containers:
        - name: mysql  
          image: mysql:5.7  
          ports:
            - containerPort: 3306  
          env:
            - name: MYSQL_ROOT_PASSWORD  
              value: "P@ssw0rd34!!!"
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1"